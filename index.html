
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Premium</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #ffffff;
    color: #212121;
    text-align: center;
    margin: 0;
    padding: 50px 20px;
  }

  .container {
    max-width: 600px;
    margin: auto;
  }

  .logo {
    color: #ff0033;
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 30px;
  }

  h1 {
    font-size: 30px;
    margin-bottom: 20px;
  }

  .main-benefit {
    color: #ff0033;
    font-size: 32px;
    font-weight: bold;
    margin: 30px 0;
  }

  .description {
    font-size: 18px;
    color: #555;
    margin-bottom: 30px;
  }

  .features {
    text-align: left;
    display: inline-block;
    font-size: 19px;
    line-height: 2.2;
    margin-bottom: 30px;
  }

  .cta-button {
    background-color: #ff0033;
    color: white;
    border: none;
    padding: 16px 45px;
    border-radius: 30px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
  }

  .cta-button:hover {
    background-color: #cc0029;
  }

  .footer {
    margin-top: 30px;
    color: #888;
    font-size: 13px;
  }
</style>
</head>

<body>

<div class="container">

  <div class="logo">▶ YouTube Premium</div>

  <h1>
    광고 없이 더 편하게<br>
    YouTube를 즐겨보세요!
  </h1>

  <div class="main-benefit">
    광고 없이 동영상 시청
  </div>

  <p class="description">
    끊김 없는 시청 경험으로<br>
    좋아하는 콘텐츠에 집중하세요.
  </p>

  <div class="features">
    <div>🎵 백그라운드 재생</div>
    <div>📥 오프라인 저장</div>
    <div>🎧 YouTube Music</div>
  </div>

  <br>

  <button class="cta-button" id="test-button">
    YouTube Premium 시작하기
  </button>

  <div class="footer">
    언제 어디서나 더 자유로운 YouTube 경험
  </div>

</div>

</body>
</html>
